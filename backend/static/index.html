<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ragasiyam — RAG Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f1117;
      color: #e8eaf0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      padding: 11px 18px;
      background: #1a1d27;
      border-bottom: 1px solid #2d3048;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    header h1 { font-size: 1.05rem; font-weight: 600; }
    .badge {
      font-size: 0.68rem;
      background: #3b4cca22;
      color: #7b8cff;
      border: 1px solid #3b4cca55;
      padding: 2px 8px;
      border-radius: 12px;
    }
    .session-label {
      margin-left: auto;
      font-size: 0.7rem;
      color: #555870;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #new-session-btn {
      font-size: 0.68rem;
      background: #1e2235;
      color: #7b8cff;
      border: 1px solid #3b4cca55;
      padding: 2px 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    #new-session-btn:hover { background: #252945; }

    /* ── Layout: sidebar + chat ── */
    .layout {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ── Sidebar (upload panel) ── */
    #sidebar {
      width: 230px;
      min-width: 230px;
      background: #13151f;
      border-right: 1px solid #2d3048;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 12px;
      overflow-y: auto;
    }
    #sidebar h2 {
      font-size: 0.78rem;
      font-weight: 600;
      color: #7b8cff;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    #drop-zone {
      border: 2px dashed #2d3048;
      border-radius: 10px;
      padding: 18px 10px;
      text-align: center;
      font-size: 0.78rem;
      color: #555870;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    #drop-zone:hover, #drop-zone.drag-over {
      border-color: #3b4cca;
      background: #1a1d2f;
      color: #9aa8ff;
    }
    #drop-zone .icon { font-size: 1.6rem; margin-bottom: 6px; }
    #file-input { display: none; }

    #upload-btn {
      width: 100%;
      padding: 8px;
      background: #3b4cca;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    #upload-btn:hover    { background: #4a5de0; }
    #upload-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    #upload-status {
      font-size: 0.75rem;
      color: #555870;
      min-height: 18px;
    }
    #upload-status.ok    { color: #34d399; }
    #upload-status.error { color: #f87171; }

    /* Uploaded docs list */
    #docs-list { display: flex; flex-direction: column; gap: 6px; }
    #docs-list h3 {
      font-size: 0.72rem;
      color: #555870;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .doc-item {
      font-size: 0.75rem;
      background: #1e2235;
      border: 1px solid #2d3048;
      border-radius: 6px;
      padding: 6px 10px;
      color: #a0a8c8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .doc-item .doc-icon { font-size: 0.9rem; }
    .doc-item .doc-chunks { color: #555870; font-size: 0.68rem; margin-left: auto; }

    /* ── Chat area ── */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .msg {
      max-width: 74%;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.55;
      font-size: 0.9rem;
      white-space: pre-wrap;
      word-break: break-word;
      animation: fadeUp 0.18s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg.user {
      align-self: flex-end;
      background: #3b4cca;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #1e2235;
      color: #e0e4f8;
      border: 1px solid #2d3048;
      border-bottom-left-radius: 4px;
    }
    /* Grounded = answered from uploaded docs */
    .msg.assistant.grounded {
      border-left: 3px solid #7b8cff;
    }
    .grounded-badge {
      display: inline-block;
      font-size: 0.64rem;
      background: #3b4cca33;
      color: #7b8cff;
      border: 1px solid #3b4cca55;
      border-radius: 6px;
      padding: 1px 6px;
      margin-bottom: 5px;
    }
    .msg.system {
      align-self: center;
      color: #555870;
      font-size: 0.76rem;
      padding: 3px 0;
    }
    .msg.error {
      align-self: center;
      background: #2d0e0e;
      color: #f87171;
      border: 1px solid #7f1d1d;
      font-size: 0.8rem;
      border-radius: 8px;
      padding: 8px 14px;
    }
    .msg.restored { animation: none; opacity: 0.8; }

    /* Typing dots */
    .typing-dots { display: flex; gap: 4px; align-items: center; padding: 12px 14px; }
    .typing-dots span {
      width: 6px; height: 6px;
      background: #7b8cff; border-radius: 50%;
      animation: blink 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; }
      40%            { opacity: 1; }
    }

    /* ── Input bar ── */
    #input-bar {
      display: flex;
      gap: 10px;
      padding: 12px 18px;
      background: #1a1d27;
      border-top: 1px solid #2d3048;
    }
    #user-input {
      flex: 1;
      padding: 9px 13px;
      background: #12141e;
      color: #e8eaf0;
      border: 1px solid #2d3048;
      border-radius: 10px;
      font-size: 0.88rem;
      resize: none;
      outline: none;
      font-family: inherit;
      line-height: 1.4;
      transition: border-color 0.15s;
    }
    #user-input:focus { border-color: #3b4cca; }
    #user-input::placeholder { color: #444860; }
    #send-btn {
      padding: 9px 20px;
      background: #3b4cca;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      align-self: flex-end;
    }
    #send-btn:hover   { background: #4a5de0; }
    #send-btn:active  { transform: scale(0.97); }
    #send-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  </style>
</head>
<body>

<header>
  <h1>🔮 Ragasiyam</h1>
  <span class="badge">Gemini Flash · RAG</span>
  <span class="session-label">
    <span id="session-display"></span>
    <button id="new-session-btn">+ New session</button>
  </span>
</header>

<div class="layout">

  <!-- ── Upload sidebar ── -->
  <div id="sidebar">
    <h2>📄 Documents</h2>

    <div id="drop-zone">
      <div class="icon">⬆️</div>
      <div>Drop PDF or TXT here<br>or click to browse</div>
      <input type="file" id="file-input" accept=".pdf,.txt,.md" />
    </div>

    <button id="upload-btn" disabled>Upload</button>
    <div id="upload-status"></div>

    <div id="docs-list">
      <h3>Uploaded this session</h3>
      <!-- doc-items injected here -->
    </div>
  </div>

  <!-- ── Chat area ── -->
  <div class="chat-area">
    <div id="messages"></div>
    <div id="input-bar">
      <textarea
        id="user-input"
        rows="1"
        placeholder="Ask anything… (Enter to send, Shift+Enter for newline)"
        autofocus
      ></textarea>
      <button id="send-btn">Send</button>
    </div>
  </div>

</div><!-- /.layout -->

<script>
  // ── Session ───────────────────────────────────────────────────────────────
  function getOrCreateSession() {
    const params = new URLSearchParams(window.location.search);
    let id = params.get("session") || localStorage.getItem("ragasiyam_session");
    if (!id) {
      id = "s_" + Math.random().toString(36).slice(2, 11);
      localStorage.setItem("ragasiyam_session", id);
    }
    return id;
  }
  let sessionId = getOrCreateSession();
  document.getElementById("session-display").textContent = "session: " + sessionId;
  document.getElementById("new-session-btn").addEventListener("click", () => {
    const id = "s_" + Math.random().toString(36).slice(2, 11);
    localStorage.setItem("ragasiyam_session", id);
    window.location.search = "?session=" + id;
  });

  // ── DOM refs ──────────────────────────────────────────────────────────────
  const messagesEl  = document.getElementById("messages");
  const inputEl     = document.getElementById("user-input");
  const sendBtn     = document.getElementById("send-btn");
  const dropZone    = document.getElementById("drop-zone");
  const fileInput   = document.getElementById("file-input");
  const uploadBtn   = document.getElementById("upload-btn");
  const uploadStatus = document.getElementById("upload-status");
  const docsList    = document.getElementById("docs-list");

  // ── Message helpers ───────────────────────────────────────────────────────
  function addMessage(role, text, opts = {}) {
    const div = document.createElement("div");
    div.className = "msg " + role + (opts.restored ? " restored" : "") + (opts.grounded ? " grounded" : "");
    if (opts.grounded) {
      const badge = document.createElement("div");
      badge.className = "grounded-badge";
      badge.textContent = "📎 answered from your documents";
      div.appendChild(badge);
    }
    const textNode = document.createElement("div");
    textNode.textContent = text;
    div.appendChild(textNode);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function addTyping() {
    const div = document.createElement("div");
    div.className = "msg assistant";
    div.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
  });

  // ── Load history on page load ─────────────────────────────────────────────
  async function loadHistory() {
    try {
      const res = await fetch(`/history/${encodeURIComponent(sessionId)}`);
      if (!res.ok) return;
      const msgs = await res.json();
      if (!msgs.length) {
        addMessage("system", "New session — upload a document or just start chatting.");
        return;
      }
      for (const m of msgs) {
        addMessage(m.role === "assistant" ? "assistant" : "user", m.content, { restored: true });
      }
      addMessage("system", `↑ ${msgs.length} messages restored`);
    } catch {
      addMessage("system", "New session — upload a document or just start chatting.");
    }
  }

  // ── File upload ───────────────────────────────────────────────────────────
  let selectedFile = null;

  function setFile(f) {
    if (!f) return;
    selectedFile = f;
    dropZone.querySelector("div:last-child").textContent = f.name;
    uploadBtn.disabled = false;
    uploadStatus.textContent = "";
    uploadStatus.className = "";
  }

  dropZone.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => setFile(fileInput.files[0]));
  dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("drag-over"); });
  dropZone.addEventListener("dragleave", () => dropZone.classList.remove("drag-over"));
  dropZone.addEventListener("drop", e => {
    e.preventDefault();
    dropZone.classList.remove("drag-over");
    setFile(e.dataTransfer.files[0]);
  });

  uploadBtn.addEventListener("click", async () => {
    if (!selectedFile) return;
    uploadBtn.disabled = true;
    uploadStatus.textContent = "Uploading & embedding…";
    uploadStatus.className = "";

    const form = new FormData();
    form.append("session_id", sessionId);
    form.append("file", selectedFile);

    try {
      const res = await fetch("/upload", { method: "POST", body: form });
      const data = await res.json();
      if (!res.ok) {
        uploadStatus.textContent = "⚠ " + (data.detail || "Upload failed");
        uploadStatus.className = "error";
      } else {
        uploadStatus.textContent = `✓ ${data.chunks} chunks indexed`;
        uploadStatus.className = "ok";
        addDocItem(data.file, data.chunks);
        addMessage("system", `📄 "${data.file}" uploaded — ${data.chunks} chunks ready for search.`);
      }
    } catch (e) {
      uploadStatus.textContent = "⚠ Network error";
      uploadStatus.className = "error";
    } finally {
      uploadBtn.disabled = false;
      selectedFile = null;
      fileInput.value = "";
      dropZone.querySelector("div:last-child").textContent = "Drop PDF or TXT here\nor click to browse";
    }
  });

  function addDocItem(filename, chunks) {
    const item = document.createElement("div");
    item.className = "doc-item";
    const ext = filename.split(".").pop().toLowerCase();
    item.innerHTML = `
      <span class="doc-icon">${ext === "pdf" ? "📕" : "📄"}</span>
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${filename}</span>
      <span class="doc-chunks">${chunks}c</span>`;
    docsList.appendChild(item);
  }

  // ── Send message (streaming via /chat/stream SSE) ─────────────────────────
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = "";
    inputEl.style.height = "auto";
    sendBtn.disabled = true;

    addMessage("user", text);
    const typingEl = addTyping();

    try {
      const res = await fetch("/chat/stream", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ session_id: sessionId, message: text }),
      });

      if (!res.ok) {
        typingEl.remove();
        const err = await res.json().catch(() => ({ detail: "Unknown error" }));
        addMessage("error", "⚠ " + (err.detail || res.statusText));
        return;
      }

      // Swap typing indicator for a live bubble
      typingEl.remove();
      const replyDiv = document.createElement("div");
      replyDiv.className = "msg assistant";
      const textNode = document.createElement("div");
      replyDiv.appendChild(textNode);
      messagesEl.appendChild(replyDiv);
      messagesEl.scrollTop = messagesEl.scrollHeight;

      const reader  = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer    = "";
      let fullText  = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const lines = buffer.split("\n\n");
        buffer = lines.pop();  // keep partial last chunk

        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          let evt;
          try { evt = JSON.parse(line.slice(6)); } catch { continue; }

          if (evt.error) {
            textNode.textContent = "⚠ " + evt.error;
            replyDiv.className = "msg error";
            break;
          }
          if (evt.text) {
            fullText += evt.text;
            textNode.textContent = fullText;
            messagesEl.scrollTop = messagesEl.scrollHeight;
          }
          if (evt.done && evt.grounded) {
            replyDiv.classList.add("grounded");
            const badge = document.createElement("div");
            badge.className = "grounded-badge";
            badge.textContent = "📎 answered from your documents";
            replyDiv.insertBefore(badge, textNode);
          }
        }
      }
    } catch (e) {
      typingEl.remove();
      addMessage("error", "⚠ Network error: " + e.message);
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  loadHistory();
</script>
</body>
</html>
